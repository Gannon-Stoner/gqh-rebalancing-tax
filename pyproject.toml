[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gqh"
version = "0.1.0"
description = "Gator Quant Hacks 2026: pre-registered month-end 60/40 rebalancing test on ES/ZN futures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "exchange_calendars",
    "pyyaml",
    "statsmodels",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
